# Every push to main: run all checks, then build and deploy to Firebase
# (Hosting + Firestore security rules + indexes).
name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck, lint, tests, rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4 # the Firestore emulator (rules tests) needs Java
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:rules

  deploy:
    name: Build and deploy
    needs: check
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_USE_EMULATOR: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check that the GitHub secrets are set
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          missing=""
          for v in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          [ -z "$SA" ] && missing="$missing FIREBASE_SERVICE_ACCOUNT"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing (see README, section 'GitHub + automatic deploy')"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Write the service account key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: Deploy Hosting + Firestore rules + indexes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: >
          npx firebase deploy
          --only hosting,firestore:rules,firestore:indexes
          --project "$VITE_FIREBASE_PROJECT_ID"
          --non-interactive
          --message "GitHub ${{ github.sha }}"
      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
